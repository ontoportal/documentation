name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'v**']

permissions:
  contents: read

jobs:
  jekyll-build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: bundle exec rake search:init

  assets:
    name: Test custom CSS and JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
